<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Mondepro Ultra | Admin Edition</title> 
    <!-- Fonts & Icons --> 
    <link rel="stylesheet" href="https://cloudflare.com"> 
    <link href="https://googleapis.com" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cloudflare.com"/>
<style> 
    :root { --bg: #050505; --card: #121212; --accent: #ffcc00; --text: #ffffff; --dim: #a0a0a0; --live: #ff0000; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); background-image: radial-gradient(circle at top right, #1a1a00, transparent 40%); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    
    /* Header */ 
    .app-header { position: sticky; top: 0; z-index: 1000; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); padding: 15px 20px; border-bottom: 1px solid rgba(255, 204, 0, 0.2); display: flex; justify-content: space-between; align-items: center; } 
    .brand { font-weight: 900; font-size: 24px; letter-spacing: 1px; cursor: pointer; } 
    .brand span { color: var(--accent); text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
    
    /* Calendar */ 
    .cal-wrapper { background: #0a0a0a; padding: 15px 10px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; } 
    .cal-wrapper::-webkit-scrollbar { display: none; } 
    .date-card { min-width: 70px; padding: 12px 5px; background: var(--card); border-radius: 15px; border: 1px solid #222; text-align: center; cursor: pointer; transition: 0.3s; } 
    .date-card.active { background: var(--accent); color: #000; border-color: var(--accent); transform: scale(1.05); } 
    .date-card .day-name { font-size: 10px; font-weight: bold; display: block; opacity: 0.8; } 
    .date-card .day-num { font-size: 20px; font-weight: 900; display: block; }
    
    /* Filters */ 
    .filter-bar { display: flex; gap: 10px; padding: 15px; max-width: 600px; margin: 0 auto; } 
    .f-btn { flex: 1; padding: 12px; border-radius: 30px; border: 1px solid #222; background: var(--card); color: var(--dim); font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 13px; text-align: center; } 
    .f-btn.active { background: #fff; color: #000; border-color: #fff; }
    
    /* League Groups */ 
    .league-container { max-width: 650px; margin: 0 auto; padding: 0 15px 100px; } 
    .league-group { margin-bottom: 25px; animation: fadeInUp 0.5s ease backwards; } 
    .league-head { background: linear-gradient(90deg, #1a1a1a, transparent); padding: 10px 15px; border-radius: 10px; color: var(--accent); font-weight: 900; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; border-right: 4px solid var(--accent); }
    
    /* Match Card */ 
    .match-card { background: var(--card); border-radius: 20px; padding: 20px 15px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.03); position: relative; overflow: hidden; transition: 0.3s; cursor: pointer; } 
    .match-card:hover { border-color: var(--accent); background: #181818; } 
    .live-badge { position: absolute; top: 0; left: 0; background: var(--live); color: #fff; font-size: 9px; font-weight: 900; padding: 4px 12px; border-bottom-right-radius: 15px; animation: pulse 1.5s infinite; }
    .admin-edit-btn { position: absolute; top: 5px; left: 5px; background: #333; color: #fff; border: none; padding: 3px 8px; font-size: 10px; border-radius: 5px; display: none; z-index: 10; }
    
    .m-grid { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; text-align: center; } 
    .team img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 8px; } 
    .team .t-name { font-size: 13px; font-weight: 900; color: #fff; }
    .score-area { display: flex; flex-direction: column; align-items: center; } 
    .score-box { font-size: 20px; font-weight: 900; color: var(--accent); background: #000; padding: 5px 10px; border-radius: 12px; border: 1px solid #333; min-width: 80px; letter-spacing: 1px; } 
    .m-time { font-size: 11px; color: #fff; margin-top: 8px; font-weight: bold; opacity: 0.8; }
    
    .m-meta { margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; gap: 15px; font-size: 11px; color: #666; } 
    .m-meta span i { color: var(--accent); margin-left: 4px; }
    
    /* ─── PLAYER OVERLAY ─── */
    .player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 10px; backdrop-filter: blur(10px); }
    .player-container { background: #000; width: 100%; max-width: 750px; border-radius: 20px; border: 1px solid rgba(255, 204, 0, 0.3); overflow: hidden; box-shadow: 0 0 30px rgba(255, 204, 0, 0.15); }
    .player-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0a0a0a; border-bottom: 1px solid #222; }
    .player-title { font-weight: 900; font-size: 14px; color: var(--accent); }
    .close-player { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .server-list { display: flex; gap: 8px; padding: 15px; background: #0a0a0a; overflow-x: auto; border-top: 1px solid #222; }
    .server-btn { padding: 8px 16px; background: var(--card); border: 1px solid #333; color: #fff; font-family: 'Tajawal'; font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
    .server-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* ─── ADMIN DASHBOARD PANEL ─── */
    .admin-panel { position: fixed; bottom: 0; left: 0; width: 100%; max-height: 80vh; background: #0f0f0f; border-top: 2px solid var(--accent); z-index: 3000; padding: 20px; display: none; overflow-y: auto; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
    .admin-panel h3 { color: var(--accent); margin-bottom: 15px; font-size: 16px; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; font-family: 'Tajawal'; font-size: 13px; }
    .admin-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-save { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-close { background: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }

    /* Loader & Animations */ 
    .loader { text-align: center; padding: 80px 20px; } 
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } } 
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } } 
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .error-msg { text-align: center; padding: 40px; color: var(--dim); } 
</style>
</head>
<body>

<header class="app-header"> 
    <!-- الضغط المطول أو المتكرر على اللوجو يفتح لوحة التحكم -->
    <div class="brand" onclick="triggerAdmin()">MONDE<span>PRO</span></div> 
    <div id="live-time" style="font-size: 12px; font-weight: 900; color: var(--accent);">00:00:00</div>
</header>

<main> 
    <div class="cal-wrapper" id="calendar"></div> 
    <div class="filter-bar"> 
        <div class="f-btn active" onclick="setFilter('all', this)">الكل</div> 
        <div class="f-btn" onclick="setFilter('live', this)"><i class="fas fa-circle" style="font-size: 8px; color:red;"></i> مباشر</div> 
    </div>
    <div id="content" class="league-container"> <!-- المباريات --> </div>
</main>

<!-- ─── واجهة المشغل البوب أب ─── -->
<div class="player-overlay" id="playerOverlay">
    <div class="player-container">
        <div class="player-header">
            <div class="player-title" id="playerTitle">بث مباشر للمباراة</div>
            <button class="close-player" onclick="closePlayer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="player-wrapper">
            <iframe id="liveFrame" src="" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="server-list" id="serverList"><!-- أزرار السيرفرات المتعددة --></div>
    </div>
</div>

<!-- ─── لوحة التحكم بالمباريات والروابط المتعددة (Dashboard) ─── -->
<div class="admin-panel" id="adminPanel">
    <h3>
        <span><i class="fas fa-tools"></i> تعديل روابط البث المباشر</span>
        <span id="targetMatchId" style="font-size:11px; color:var(--dim);">ID: --</span>
    </h3>
    <div class="form-group">
        <label>اسم المباراة المعروضة</label>
        <input type="text" id="admMatchTitle" class="form-control" readonly>
    </div>
    <div class="form-group">
        <label>السيرفر 1 (رابط الـ Embed أو الـ iframe الخارجي)</label>
        <input type="text" id="srvUrl1" class="form-control" placeholder="https://domain.com">
    </div>
    <div class="form-group">
        <label>السيرفر 2</label>
