<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BALLON TV PRO | جدول المباريات</title>

    <!-- الروابط الخارجية للخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #ff0000;
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --neon: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1a0000, transparent 40%),
                              radial-gradient(circle at bottom left, #001220, transparent 40%);
            background-attachment: fixed;
            color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0;
        }

        /* شريط التحميل */
        #loader {
            position: fixed; top: 0; left: 0; height: 3px; width: 0%;
            background: linear-gradient(90deg, transparent, var(--primary), #fff);
            z-index: 9999; transition: 0.5s;
        }

        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--primary); padding: 15px 20px;
            display: flex; justify-content: center; align-items: center;
        }

        .brand-logo { font-weight: 900; font-size: 1.8rem; letter-spacing: -1px; }
        .brand-logo span { color: var(--primary); text-shadow: 0 0 15px var(--primary); }

        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        .section-title { 
            font-weight: 900; font-size: 1.2rem; margin-bottom: 20px; 
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::before { content: ''; width: 4px; height: 25px; background: var(--primary); border-radius: 10px; }

        /* تصميم كارت المباراة */
        .match-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px;
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: white; transition: 0.3s ease;
            position: relative; overflow: hidden;
        }
        .match-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--neon); }

        .team { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .team img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 8px; background: rgba(255,255,255,0.1); border-radius: 50%; padding: 5px; }
        .team-name { font-size: 0.9rem; font-weight: 700; }

        .match-info { flex: 1; text-align: center; }
        .match-time { 
            background: var(--primary); padding: 5px 15px; 
            border-radius: 50px; font-weight: 900; font-size: 0.85rem;
            display: inline-block; margin-bottom: 5px;
        }
        .match-score { font-size: 1.5rem; font-weight: 900; letter-spacing: 5px; margin: 5px 0; display: block; }
        .league-name { font-size: 0.75rem; color: #aaa; display: block; }

        .loading-box { text-align: center; padding: 100px 0; color: #666; font-weight: bold; }
        
        .live-tag {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: #27ae60; color: white; font-size: 9px; padding: 2px 10px;
            border-radius: 10px; font-weight: 900; display: none;
        }
        .live .live-tag { display: block; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 600px) {
            .team-name { font-size: 0.8rem; }
            .match-score { font-size: 1.2rem; }
            .match-card { padding: 15px 5px; }
        }
    </style>
</head>
<body>

    <div id="loader"></div>

    <header class="app-header">
        <div class="brand-logo">BALLON<span>TV PRO</span></div>
    </header>

    <div class="container">
        <div class="section-title">مباريات اليوم المباشرة</div>
        <div id="matches-grid">
            <div class="loading-box">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x mb-3"></i><br>
                جاري جلب المباريات من السيرفر المطور...
            </div>
        </div>
    </div>

    <script>
        // إعدادات الروابط مع استخدام البروكسي لتجاوز CORS
        const CONFIG = {
            API_BASE: 'https://ws.kora-api.space/api/matches/',
            TEAM_LOGO_BASE: 'https://cdn.kora-api.space/uploads/team/',
            STREAM_BASE: 'https://xyztotal-sporteks-online.panel001.mov/?m='
        };

        async function fetchMatches() {
            const grid = document.getElementById('matches-grid');
            const loader = document.getElementById('loader');
            
            // الحصول على تاريخ اليوم بتنسيق YYYY-MM-DD
            const today = new Date().toISOString().split('T')[0];
            const targetUrl = `${CONFIG.API_BASE}${today}/1`;

            try {
                loader.style.width = '40%';
                
                // استخدام بروكسي AllOrigins لتجاوز الحماية
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                const result = JSON.parse(data.contents);

                loader.style.width = '100%';
                grid.innerHTML = '';

                const matches = result.matches || [];

                if (matches.length > 0) {
                    matches.forEach(match => {
                        grid.appendChild(createMatchCard(match));
                    });
                } else {
                    grid.innerHTML = '<div class="loading-box">لا توجد مباريات مدرجة لليوم.</div>';
                }
                
                setTimeout(() => loader.style.width = '0%', 500);

            } catch (error) {
                console.error("Fetch Error:", error);
                grid.innerHTML = '<div class="loading-box" style="color:#ff6b6b">خطأ في الاتصال بالسيرفر. تأكد من توفر المباريات حالياً.</div>';
                loader.style.width = '0%';
            }
        }

        function createMatchCard(match) {
            const card = document.createElement('a');
            // تحديد الحالة (مباشر أو انتهى أو لم يبدأ)
            const isLive = match.status == '1';
            card.className = `match-card ${isLive ? 'live' : ''} animate__animated animate__fadeInUp`;
            
            // رابط البث المباشر
            card.href = `${CONFIG.STREAM_BASE}${match.id}&lang=ar`;
            card.target = "_blank";

            // جلب الشعارات
            const homeLogo = match.home_logo ? `${CONFIG.TEAM_LOGO_BASE}${match.home_logo}` : 'https://cdn-icons-png.flaticon.com/512/1165/1165222.png';
            const awayLogo = match.away_logo ? `${CONFIG.TEAM_LOGO_BASE}${match.away_logo}` : 'https://cdn-icons-png.flaticon.com/512/1165/1165222.png';

            card.innerHTML = `
                <div class="live-tag">LIVE - مباشر</div>
                <div class="team">
                    <img src="${homeLogo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1165/1165222.png'">
                    <span class="team-name">${match.home_en || match.home}</span>
                </div>
                <div class="match-info">
                    <span class="match-time">${match.time}</span>
                    <span class="match-score">${match.score || 'VS'}</span>
                    <span class="league-name">${match.league_en || match.league}</span>
                </div>
                <div class="team">
                    <img src="${awayLogo}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1165/1165222.png'">
                    <span class="team-name">${match.away_en || match.away}</span>
                </div>
            `;
            return card;
        }

        // تشغيل الجلب عند تحميل الصفحة
        window.onload = fetchMatches;
    </script>
</body>
</html>
