<!DOCTYPE html>
<html dir="ltr" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLONTV PRO | Streaming Football en Direct</title>
    
    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/clappr/latest/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/clappr.level-selector/latest/level-selector.min.js"></script>

    <style>
        :root {
            --primary: #e91e63; /* Pink/Red Premium */
            --bg-dark: #0a0e12;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #8b949e;
        }

        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* Professional Header */
        header {
            background: rgba(22, 27, 34, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: var(--primary); }
        .logo span { color: #fff; }

        .app-btn {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(233, 30, 99, 0.4);
        }
        .app-btn:hover { transform: scale(1.05); background: #ff2e7e; }

        /* Player Area */
        .player-section { background: #000; width: 100%; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .player-container { width: 100%; max-width: 1000px; margin: auto; aspect-ratio: 16/9; }
        #player, #iframe-player { width: 100% !important; height: 100% !important; border: none; }
        #iframe-player { display: none; }

        /* Servers List */
        .server-bar {
            background: #1c2128;
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
        }
        .server-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: 0.3s;
        }
        .server-btn.active { background: var(--primary); color: white; border-color: #fff; }

        /* Main Content */
        .main-container { padding: 30px 5%; max-width: 1200px; margin: auto; }

        .section-title { font-size: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary); padding-left: 15px; }

        /* Match Cards Grid */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .match-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .match-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .match-card.active { background: rgba(233, 30, 99, 0.1); border-color: var(--primary); }

        .match-card .status { 
            position: absolute; top: 10px; right: 15px; font-size: 10px; 
            background: #ff0000; color: #fff; padding: 2px 8px; border-radius: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.5} 100% {opacity: 1} }

        .match-info { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .team { text-align: center; width: 45%; }
        .team img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .team-name { font-size: 14px; font-weight: 600; }
        .vs-box { font-weight: 800; color: var(--primary); font-size: 18px; }

        /* Footer Profit Area */
        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 12px; }
        
        /* Ad Banner */
        .banner-ad {
            background: linear-gradient(90deg, #161b22, #21262d);
            margin: 20px 0; padding: 20px; border-radius: 10px;
            text-align: center; border: 1px dashed var(--primary);
        }
        .banner-ad a { color: #fff; text-decoration: none; font-weight: 600; }

        .floating-action {
            position: fixed; bottom: 20px; right: 20px;
            background: #25d366; color: white; padding: 12px 20px;
            border-radius: 50px; font-weight: bold; font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 999;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">BALLON<span>TV PRO</span></div>
    <a href="https://omg10.com/4/10270118" target="_blank" class="app-btn">TÉLÉCHARGER L'APP 📲</a>
</header>

<div class="player-section">
    <div class="player-container">
        <div id="player"></div>
        <iframe id="iframe-player" allowfullscreen="true" scrolling="no"></iframe>
    </div>
</div>

<div class="server-bar" id="server-list">
    <!-- Servers injected by JS -->
</div>

<div class="main-container">
    
    <div class="banner-ad">
        <a href="https://omg10.com/4/10270118" target="_blank">🚀 Regardez en 4K sans pubs sur l'application officielle BALLONTV !</a>
    </div>

    <h2 class="section-title">Matchs en Direct Aujourd'hui</h2>
    
    <div class="match-grid" id="match-list">
        <!-- Matches injected by JS -->
    </div>

</div>

<a href="https://t.me/your_telegram" class="floating-action" target="_blank">Support Telegram 💬</a>

<footer>
    <p>&copy; 2026 BALLONTV PRO - All Rights Reserved</p>
    <p style="margin-top:10px">Streaming HD Gratuit | UEFA - La Liga - Premier League</p>
</footer>

<script>
    // Database of matches and links
    const matches = [
        {
            id: 0,
            home: "Real Madrid",
            away: "Real Sociedad",
            homeLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png",
            awayLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f1/Real_Sociedad_logo.svg/1200px-Real_Sociedad_logo.svg.png",
            servers: [
                { title: "Serveur VIP (PHP)", url: "https://redperch.space/dramacardinal.php?id=alwan1", type: "iframe" },
                { title: "HD Direct", url: "http://50.7.120.34:8080/DAZN1/index.m3u8", type: "m3u8" }
            ]
        },
        {
            id: 1,
            home: "Newcastle",
            away: "West Brom",
            homeLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Newcastle_United_Logo.svg/1200px-Newcastle_United_Logo.svg.png",
            awayLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/8b/WBA_Logo.svg/1200px-WBA_Logo.svg.png",
            servers: [
                { title: "Direct PL 1", url: "http://50.7.120.34:8080/DAZN1/index.m3u8", type: "m3u8" },
                { title: "Alternative HD", url: "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8", type: "m3u8" }
            ]
        },
        {
            id: 2,
            home: "Tottenham",
            away: "Charlton",
            homeLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/b/b4/Tottenham_Hotspur.svg/1200px-Tottenham_Hotspur.svg.png",
            awayLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/30/Charlton_Athletic_FC_logo.svg/1200px-Charlton_Athletic_FC_logo.svg.png",
            servers: [
                { title: "Serveur Main", url: "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8", type: "m3u8" }
            ]
        },
        {
            id: 3,
            home: "Lyon",
            away: "Fenerbahçe",
            homeLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/c/c6/Olympique_Lyonnais_logo.svg/1200px-Olympique_Lyonnais_logo.svg.png",
            awayLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/3/39/Fenerbah%C3%A7e_S.K._logo.svg/1200px-Fenerbah%C3%A7e_S.K._logo.svg.png",
            servers: [
                { title: "Canal+ Sport", url: "http://cp11.adabmedia.com/hls2/persiana.m3u8", type: "m3u8" }
            ]
        }
    ];

    var clapprPlayer;

    // Load Matches into the grid
    function renderMatches() {
        const list = document.getElementById('match-list');
        matches.forEach(m => {
            const card = document.createElement('div');
            card.className = `match-card ${m.id === 0 ? 'active' : ''}`;
            card.id = `match-${m.id}`;
            card.onclick = () => selectMatch(m.id);
            card.innerHTML = `
                <div class="status">LIVE</div>
                <div class="match-info">
                    <div class="team">
                        <img src="${m.homeLogo}">
                        <div class="team-name">${m.home}</div>
                    </div>
                    <div class="vs-box">VS</div>
                    <div class="team">
                        <img src="${m.awayLogo}">
                        <div class="team-name">${m.away}</div>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function selectMatch(matchId) {
        document.querySelectorAll('.match-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`match-${matchId}`).classList.add('active');
        
        const m = matches[matchId];
        const serverList = document.getElementById('server-list');
        serverList.innerHTML = '';

        m.servers.forEach((srv, i) => {
            const btn = document.createElement('div');
            btn.className = `server-btn ${i === 0 ? 'active' : ''}`;
            btn.innerText = srv.title;
            btn.onclick = (e) => {
                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playSource(srv);
                triggerAd();
            };
            serverList.appendChild(btn);
        });

        playSource(m.servers[0]);
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function playSource(srv) {
        const pDiv = document.getElementById('player');
        const iFrame = document.getElementById('iframe-player');

        if (srv.type === "iframe") {
            pDiv.style.display = "none";
            iFrame.style.display = "block";
            iFrame.src = srv.url;
            if (clapprPlayer) clapprPlayer.pause();
        } else {
            iFrame.style.display = "none";
            iFrame.src = "";
            pDiv.style.display = "block";
            if (clapprPlayer) {
                clapprPlayer.configure({ source: srv.url });
            } else {
                clapprPlayer = new Clappr.Player({
                    source: srv.url,
                    parentId: "#player",
                    plugins: [LevelSelector],
                    width: '100%',
                    height: '100%',
                    autoPlay: true
                });
            }
        }
    }

    function triggerAd() {
        if(Math.random() > 0.5) { // 50% chance for extra profit
            window.open("https://omg10.com/4/10241472", "_blank");
        }
    }

    // Initialize
    window.onload = () => {
        renderMatches();
        selectMatch(0);
    };

    // First click ad (Pop-under)
    document.body.addEventListener('click', () => {
        if (!window.adsOnce) {
            window.open("https://omg10.com/4/10241472", "_blank");
            window.adsOnce = true;
        }
    }, { once: true });
</script>

</body>
</html>
