<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mondepro | المحرك الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #111111; --accent: #ffcc00; --text: #ffffff; --dim: #888888; --live: #ff0000; }
        * { margin:0; padding:0; box-sizing:border-box; outline:none; }
        body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* الهيدر */
        .top-bar { position:fixed; top:0; width:100%; height:60px; background:rgba(0,0,0,0.9); backdrop-filter: blur(10px); display:flex; align-items:center; justify-content:center; z-index:1000; border-bottom:1px solid #222; }
        .logo-text { font-weight:900; font-size:22px; text-transform: uppercase; }
        .logo-text span { color:var(--accent); text-shadow: 0 0 10px rgba(255, 204, 0, 0.4); }

        main { padding-top: 70px; padding-bottom: 30px; max-width: 600px; margin: 0 auto; }

        /* التقويم */
        .calendar-scroll { display: flex; overflow-x: auto; gap: 8px; padding: 10px 15px; scrollbar-width: none; }
        .calendar-scroll::-webkit-scrollbar { display: none; }
        .date-item { min-width: 60px; padding: 10px; background: var(--surface); border-radius: 12px; border: 1px solid #222; text-align: center; cursor: pointer; transition: 0.3s; }
        .date-item.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .date-item span { display: block; }
        .d-name { font-size: 10px; font-weight: bold; }
        .d-num { font-size: 18px; font-weight: 900; }

        /* الفلترة */
        .tabs { display: flex; gap: 10px; padding: 10px 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #222; background: var(--surface); color: var(--dim); cursor: pointer; font-family: inherit; font-weight: bold; font-size: 13px; }
        .tab-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* البطولات والمباريات */
        .league-card { margin: 15px; background: var(--surface); border-radius: 15px; border: 1px solid #222; overflow: hidden; }
        .league-title { background: #1a1a1a; padding: 10px 15px; font-size: 13px; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #222; }
        
        .match-item { padding: 20px 15px; border-bottom: 1px solid #1a1a1a; position: relative; }
        .match-item:last-child { border-bottom: none; }
        
        .match-grid { display: grid; grid-template-columns: 1fr 80px 1fr; align-items: center; text-align: center; }
        .team img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .team .name { font-size: 12px; font-weight: bold; display: block; }
        
        .score-wrap { background: #000; border-radius: 10px; padding: 8px 5px; border: 1px solid #222; }
        .score { font-size: 18px; font-weight: 900; color: var(--accent); }
        .status { font-size: 10px; color: #fff; margin-top: 4px; display: block; }

        .live-label { position: absolute; top: 0; left: 0; background: var(--live); color: #fff; font-size: 9px; font-weight: bold; padding: 3px 10px; border-bottom-right-radius: 10px; animation: blink 1s infinite; }

        .loader { text-align: center; padding: 50px; color: var(--accent); font-weight: bold; }

        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="logo-text">MONDE<span>PRO</span></div>
</header>

<main>
    <div class="calendar-scroll" id="calendar"></div>
    
    <div class="tabs">
        <button class="tab-btn active" id="all-tab" onclick="switchFilter('all')">كل المباريات</button>
        <button class="tab-btn" id="live-tab" onclick="switchFilter('live')"><i class="fas fa-circle" style="font-size: 8px; color:red;"></i> مباشر</button>
    </div>

    <div id="content">
        <div class="loader"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات...</div>
    </div>
</main>

<script>
    const SOURCE_URL = "https://ebengaza1.kesug.com/";
    const PROXY = "https://corsproxy.io/?url=";
    let selectedDate = new Date().toISOString().split('T')[0];
    let currentFilter = 'all';

    // 1. إنشاء التقويم
    function initCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '';
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        
        for (let i = -2; i <= 3; i++) {
            let d = new Date();
            d.setDate(d.getDate() + i);
            let dStr = d.toISOString().split('T')[0];
            let active = dStr === selectedDate ? 'active' : '';
            
            cal.innerHTML += `
                <div class="date-item ${active}" onclick="changeDate('${dStr}')">
                    <span class="d-name">${days[d.getDay()]}</span>
                    <span class="d-num">${d.getDate()}</span>
                </div>
            `;
        }
    }

    // 2. جلب وتحليل البيانات من موقعك
    async function fetchFromSource() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loader"><i class="fas fa-circle-notch fa-spin"></i> جاري استخراج البيانات من المصدر...</div>';

        try {
            const target = `${SOURCE_URL}?d=${selectedDate}`;
            const response = await fetch(PROXY + encodeURIComponent(target));
            const html = await response.text();
            
            // تحويل النص إلى HTML Document للبحث بداخله
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const leagues = doc.querySelectorAll('.league-group');

            if (leagues.length === 0) {
                content.innerHTML = '<div style="text-align:center; padding:50px; color:#666;">لا توجد مباريات متاحة في المصدر لهذا التاريخ.</div>';
                return;
            }

            renderData(leagues);
        } catch (error) {
            content.innerHTML = '<div style="text-align:center; padding:50px; color:red;">خطأ في الاتصال بالمصدر. تأكد من أن الموقع يعمل.</div>';
        }
    }

    // 3. عرض البيانات بتصميم Mondepro
    function renderData(leagues) {
        const content = document.getElementById('content');
        content.innerHTML = '';

        leagues.forEach(league => {
            const title = league.querySelector('.group-header').innerText;
            const matches = league.querySelectorAll('.m-card');
            let leagueHtml = `<div class="league-card"><div class="league-title"><i class="fas fa-trophy"></i> ${title}</div>`;
            let hasVisibleMatch = false;

            matches.forEach(match => {
                const homeName = match.querySelectorAll('.t-name')[0].innerText;
                const homeLogo = match.querySelectorAll('.m-logo')[0].src;
                const awayName = match.querySelectorAll('.t-name')[1].innerText;
                const awayLogo = match.querySelectorAll('.m-logo')[1].src;
                const score = match.querySelector('.match-time-txt').innerText;
                const status = match.querySelector('.match-status-txt').innerText;
                const isLive = match.querySelector('.m-live-tag').classList.contains('live-now');

                // فلترة المباشر
                if (currentFilter === 'live' && !isLive) return;
                hasVisibleMatch = true;

                leagueHtml += `
                    <div class="match-item">
                        ${isLive ? '<div class="live-label">مباشر</div>' : ''}
                        <div class="match-grid">
                            <div class="team">
                                <img src="${homeLogo}">
                                <span class="name">${homeName}</span>
                            </div>
                            <div class="score-wrap">
                                <div class="score">${score}</div>
                                <span class="status">${status}</span>
                            </div>
                            <div class="team">
                                <img src="${awayLogo}">
                                <span class="name">${awayName}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            leagueHtml += `</div>`;
            if (hasVisibleMatch) content.innerHTML += leagueHtml;
        });

        if (content.innerHTML === '') {
            content.innerHTML = '<div style="text-align:center; padding:50px; color:#666;">لا توجد مباريات جارية حالياً.</div>';
        }
    }

    // التحكم
    function changeDate(date) {
        selectedDate = date;
        initCalendar();
        fetchFromSource();
    }

    function switchFilter(type) {
        currentFilter = type;
        document.getElementById('all-tab').classList.toggle('active', type === 'all');
        document.getElementById('live-tab').classList.toggle('active', type === 'live');
        fetchFromSource();
    }

    window.onload = () => {
        initCalendar();
        fetchFromSource();
        // تحديث كل 30 ثانية
        setInterval(fetchFromSource, 30000);
    };
</script>

</body>
</html>
