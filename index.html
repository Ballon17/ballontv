<!DOCTYPE html>
<html dir="ltr" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLONTV PRO | Streaming Foot Premium</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Video Player (Le lecteur du serveur 4) -->
    <script src="https://cdn.jsdelivr.net/clappr/latest/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/clappr.level-selector/latest/level-selector.min.js"></script>

    <style>
        :root {
            --primary: #ff0057; /* Couleur vive pour l'action */
            --bg-dark: #05070a;
            --card-bg: #0f1218;
            --text-main: #ffffff;
            --text-dim: #a0a6ac;
        }

        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* Header Professionnel */
        header {
            background: #0f1218;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .logo span { color: #fff; }

        .social-links { display: flex; gap: 15px; }
        .social-icon { font-size: 22px; color: #fff; transition: 0.3s; }
        .social-icon:hover { color: var(--primary); transform: scale(1.1); }

        /* Unified Player Section */
        .player-section { background: #000; width: 100%; border-bottom: 1px solid #1f232b; }
        .player-container { width: 100%; max-width: 900px; margin: auto; aspect-ratio: 16/9; }
        #unified-player { width: 100% !important; height: 100% !important; }

        /* Universal Server Bar */
        .server-bar {
            background: #0f1218;
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .server-btn {
            background: rgba(255,255,255,0.07);
            color: #fff;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .server-btn.active { background: var(--primary); border-color: #fff; box-shadow: 0 0 15px rgba(255, 0, 87, 0.4); }

        /* Main Content */
        .main-container { padding: 30px 5%; max-width: 1200px; margin: auto; }
        .section-title { font-size: 20px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        /* Match Grid */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .match-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
            position: relative;
        }
        .match-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .match-card.active { background: rgba(255, 0, 87, 0.1); border-color: var(--primary); }

        .live-badge {
            position: absolute; top: 15px; right: 15px;
            background: #ff0000; color: #fff; font-size: 10px;
            padding: 3px 10px; border-radius: 12px; font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.4} }

        .match-teams { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
        .team { text-align: center; width: 40%; }
        .team img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 10px; }
        .team-name { font-size: 14px; font-weight: 600; color: #fff; }
        .vs { font-weight: 900; color: var(--primary); font-size: 20px; font-style: italic; }

        /* Telegram Banner */
        .promo-banner {
            background: linear-gradient(135deg, #0088cc, #004466);
            margin: 25px 0; padding: 20px; border-radius: 12px;
            text-align: center; color: #fff;
        }
        .btn-tg {
            background: #fff; color: #0088cc; text-decoration: none;
            padding: 10px 30px; border-radius: 50px; font-weight: 800;
            display: inline-block; margin-top: 15px; transition: 0.3s;
        }
        .btn-tg:hover { transform: scale(1.05); }

        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 12px; border-top: 1px solid #1f232b; }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo">BALLON<span>TV LIVE</span></a>
    <div class="social-links">
        <a href="https://tiktok.com/@satsport66" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
        <a href="https://t.me/ballontvlive" target="_blank" class="social-icon"><i class="fab fa-telegram"></i></a>
    </div>
</header>

<div class="player-section">
    <div class="player-container">
        <div id="unified-player"></div>
    </div>
</div>

<!-- Five Servers Bar (All using Server 4 Player) -->
<div class="server-bar" id="server-list">
    <!-- Server buttons injected by JS -->
</div>

<div class="main-container">
    
    <div class="promo-banner">
        <h3>🚀 APPLICATION BALLONTV V7</h3>
        <p>Streaming 4K, sans pubs et support technique 24/7.</p>
        <a href="https://t.me/ballontvlive" target="_blank" class="btn-tg"><i class="fab fa-telegram"></i> TÉLÉCHARGER L'APP</a>
    </div>

    <h2 class="section-title"><i class="fas fa-play-circle"></i> Matchs en Direct</h2>
    
    <div class="match-grid" id="match-list">
        <!-- Matches injected by JS -->
    </div>

</div>

<footer>
    <p>&copy; 2026 BALLONTV PRO - Streaming Sportif Gratuit</p>
    <p style="margin-top:5px">Suivez-nous sur TikTok @satsport66 pour les moments forts</p>
</footer>

<script>
    // Liste des matchs (قم بوضع روابط الصور التي عدلتها هنا)
    const matches = [
        {
            id: 0,
            home: "Real Madrid", away: "Real Sociedad",
            homeLogo: "https://siiiirtv.live/uploads/teams/3396.webp",
            awayLogo: "https://siiiirtv.live/uploads/teams/63.webp",
            links: [
                "https://1nyaler.streamhostingcdn.top/stream/24/index.m3u8", // Serveur 1
                "https://1nyaler.streamhostingcdn.top/stream/25/index.m3u8",   // Serveur 2
                "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8", // Serveur 3
                "https://andro.226503.xyz/checklist/androstreamlivebs1.m3u8", // Serveur 4 (Le Lecteur)
                "http://cp11.adabmedia.com/hls2/persiana.m3u8" // Serveur 5
            ]
        },
        {
            id: 1,
            home: "Newcastle", away: "West Brom",
            homeLogo: "https://siiiirtv.live/uploads/teams/220.webp",
            awayLogo: "https://siiiirtv.live/uploads/teams/4138.webp",
            links: [
                "http://50.7.120.34:8080/DAZN1/index.m3u8", 
                "http://40.160.24.55/TSN_1/index.m3u8",
                "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8",
                "https://andro.226503.xyz/checklist/androstreamlivebs1.m3u8",
                "http://cp11.adabmedia.com/hls2/persiana.m3u8"
            ]
        },
        {
            id: 2,
            home: "Tottenham", away: "Charlton",
            homeLogo: "https://siiiirtv.live/uploads/teams/222.webp",
            awayLogo: "https://siiiirtv.live/uploads/teams/4199.webp",
            links: [
                "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8",
                "https://1nyaler.streamhostingcdn.top/stream/20/index.m3u8",
                "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8",
                "https://andro.226503.xyz/checklist/androstreamlivebs1.m3u8",
                "http://cp11.adabmedia.com/hls2/persiana.m3u8"
            ]
        },
        {
            id: 3,
            home: "Lyon", away: "Fenerbahçe",
            homeLogo: "https://siiiirtv.live/uploads/teams/249.webp",
            awayLogo: "https://siiiirtv.live/uploads/teams/3559.webp",
            links: [
                "https://1nyaler.streamhostingcdn.top/stream/22/index.m3u8",
                "https://1nyaler.streamhostingcdn.top/stream/26/index.m3u8",
                "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8",
                "https://andro.226503.xyz/checklist/androstreamlivebs1.m3u8",
                "http://cp11.adabmedia.com/hls2/persiana.m3u8"
            ]
        }
    ];

    var player;

    function initApp() {
        const list = document.getElementById('match-list');
        matches.forEach(m => {
            const card = document.createElement('div');
            card.className = `match-card ${m.id === 0 ? 'active' : ''}`;
            card.id = `m-${m.id}`;
            card.onclick = () => loadMatch(m.id);
            card.innerHTML = `
                <div class="live-badge">DIRECT</div>
                <div class="match-teams">
                    <div class="team">
                        <img src="${m.homeLogo}">
                        <div class="team-name">${m.home}</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <img src="${m.awayLogo}">
                        <div class="team-name">${m.away}</div>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
        loadMatch(0);
    }

    function loadMatch(id) {
        document.querySelectorAll('.match-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`m-${id}`).classList.add('active');
        
        const m = matches[id];
        const sList = document.getElementById('server-list');
        sList.innerHTML = '';

        m.links.forEach((link, index) => {
            const btn = document.createElement('div');
            btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = `SERVEUR ${index + 1}`;
            btn.onclick = () => {
                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                startPlayer(link);
                // Ads Logic
                if(Math.random() > 0.6) window.open("https://omg10.com/4/10241472", "_blank");
            };
            sList.appendChild(btn);
        });

        startPlayer(m.links[0]);
    }

    function startPlayer(sourceUrl) {
        if (player) {
            player.configure({ source: sourceUrl });
        } else {
            player = new Clappr.Player({
                source: sourceUrl,
                parentId: "#unified-player",
                plugins: [LevelSelector],
                width: '100%',
                height: '100%',
                autoPlay: true,
                mediacontrol: {seekbar: "#ff0057", buttons: "#ff0057"}
            });
        }
    }

    window.onload = initApp;

    // Pop-under ad
    document.body.addEventListener('click', () => {
        if (!window.adsDone) {
            window.open("https://omg10.com/4/10241472", "_blank");
            window.adsDone = true;
        }
    }, { once: true });
</script>

</body>
</html>
