<!DOCTYPE html>
<html dir="ltr" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALLONTV PRO | Streaming & Scores en Direct</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Video Player Libraries -->
    <script src="https://cdn.jsdelivr.net/clappr/latest/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/clappr.level-selector/latest/level-selector.min.js"></script>

    <style>
        :root {
            --primary: #ff0057;
            --secondary: #0088cc;
            --bg-dark: #05070a;
            --card-bg: #0f1218;
            --text-main: #ffffff;
            --text-dim: #a0a6ac;
            --live-green: #00ff88;
        }

        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* --- Header --- */
        header {
            background: #0f1218;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .logo span { color: #fff; }

        .social-links { display: flex; gap: 12px; }
        .social-icon { font-size: 20px; color: #fff; transition: 0.3s; }
        .social-icon:hover { color: var(--primary); transform: scale(1.1); }

        /* --- Player Section --- */
        .player-section { background: #000; width: 100%; border-bottom: 1px solid #1f232b; }
        .player-container { width: 100%; max-width: 900px; margin: auto; aspect-ratio: 16/9; }
        #unified-player { width: 100% !important; height: 100% !important; }

        /* --- Server Bar --- */
        .server-bar {
            background: #0f1218;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 8px;
            overflow-x: auto;
        }
        .server-btn {
            background: rgba(255,255,255,0.07);
            color: #fff;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .server-btn.active { background: var(--primary); border-color: #fff; }

        /* --- Main Content --- */
        .main-container { padding: 25px 5%; max-width: 1200px; margin: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-title { font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        /* --- Match Schedule (Automated) --- */
        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .league-group { margin-bottom: 25px; }
        .league-title { 
            background: #1c2128; padding: 10px 15px; border-radius: 8px; 
            font-size: 13px; font-weight: 600; color: var(--text-dim);
            margin-bottom: 10px; border-left: 4px solid var(--primary);
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
            transition: 0.3s;
        }
        .match-card:hover { border-color: var(--primary); background: #161a22; }

        .team { text-align: center; width: 35%; }
        .team img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }
        .team-name { font-size: 12px; font-weight: 600; display: block; }

        .match-info { text-align: center; width: 30%; }
        .match-time { font-size: 14px; font-weight: 800; color: var(--primary); display: block; }
        .match-status { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
        .live-pulse { color: var(--live-green); animation: blink 1s infinite; font-weight: 800; }

        @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0.4} }

        /* --- Footer --- */
        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 11px; border-top: 1px solid #1f232b; }

        #loading { text-align: center; padding: 50px; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">BALLON<span>TV PRO</span></a>
    <div class="social-links">
        <a href="https://tiktok.com/@satsport66" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
        <a href="https://t.me/ballontvlive" target="_blank" class="social-icon"><i class="fab fa-telegram"></i></a>
    </div>
</header>

<div class="player-section">
    <div class="player-container">
        <div id="unified-player"></div>
    </div>
</div>

<div class="server-bar" id="server-list">
    <div class="server-btn active" onclick="changeServer(0)">SERVEUR 1</div>
    <div class="server-btn" onclick="changeServer(1)">SERVEUR 2</div>
    <div class="server-btn" onclick="changeServer(2)">SERVEUR 3</div>
    <div class="server-btn" onclick="changeServer(3)">SERVEUR 4</div>
    <div class="server-btn" onclick="changeServer(4)">SERVEUR 5</div>
</div>

<div class="main-container">
    <div class="section-header">
        <h2 class="section-title"><i class="fas fa-calendar-alt"></i> Matchs d'aujourd'hui</h2>
    </div>

    <div id="loading"><i class="fas fa-sync fa-spin"></i> Mise à jour des matchs...</div>
    <div id="schedule-container"></div>
</div>

<footer>
    <p>&copy; 2026 BALLONTV PRO - Streaming Sportif Gratuit</p>
    <p>Suivez-nous sur TikTok @satsport66 | Telegram @ballontvlive</p>
</footer>

<script>
    // الإعدادات الافتراضية
    const API_URL = "https://def.yacinelive.com/api/events";
    // روابط البث الافتراضية (يمكنك تغييرها لاحقاً)
    let currentStreams = [
        "https://andro.226503.xyz/checklist/androstreamlivebs1.m3u8",
        "http://50.7.120.34:8080/DAZN1/index.m3u8",
        "http://40.160.24.55/TSN_1/index.m3u8",
        "https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8",
        "http://cp11.adabmedia.com/hls2/persiana.m3u8"
    ];

    let player;

    // جالب البيانات الآلي
    async function loadSchedule() {
        try {
            // ملاحظة: قد تحتاج لبروكسي CORS إذا كنت تشغله من المتصفح مباشرة
            const response = await fetch(API_URL);
            const data = await response.json();
            renderSchedule(data);
        } catch (error) {
            console.error("API Error:", error);
            document.getElementById('loading').innerHTML = "⚠️ Connexion API impossible. Rechargez la page.";
        }
    }

    function renderSchedule(events) {
        const container = document.getElementById('schedule-container');
        document.getElementById('loading').style.display = 'none';
        container.innerHTML = '';

        // تجميع المباريات حسب البطولة
        const grouped = events.reduce((acc, event) => {
            const league = event.league || "Autres Compétitions";
            if (!acc[league]) acc[league] = [];
            acc[league].push(event);
            return acc;
        }, {});

        for (const league in grouped) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'league-group';
            groupDiv.innerHTML = `<div class="league-title">${league}</div>`;

            const matchGrid = document.createElement('div');
            matchGrid.className = 'schedule-grid';

            grouped[league].forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => {
                    window.scrollTo({top: 0, behavior: 'smooth'});
                    startPlayer(currentStreams[0]); // تشغيل السيرفر الأول عند اختيار المباراة
                };

                card.innerHTML = `
                    <div class="team">
                        <img src="${match.img1}" alt="${match.team1}">
                        <span class="team-name">${match.team1}</span>
                    </div>
                    <div class="match-info">
                        <span class="match-time">${match.time}</span>
                        <span class="match-status">${match.channel}</span>
                    </div>
                    <div class="team">
                        <img src="${match.img2}" alt="${match.team2}">
                        <span class="team-name">${match.team2}</span>
                    </div>
                `;
                matchGrid.appendChild(card);
            });

            groupDiv.appendChild(matchGrid);
            container.appendChild(groupDiv);
        }
    }

    // إدارة المشغل
    function startPlayer(url) {
        if (player) {
            player.configure({ source: url });
        } else {
            player = new Clappr.Player({
                source: url,
                parentId: "#unified-player",
                plugins: [LevelSelector],
                width: '100%', height: '100%', autoPlay: true,
                mediacontrol: {seekbar: "#ff0057", buttons: "#ff0057"}
            });
        }
    }

    function changeServer(index) {
        const btns = document.querySelectorAll('.server-btn');
        btns.forEach(b => b.classList.remove('active'));
        btns[index].classList.add('active');
        startPlayer(currentStreams[index]);
        
        // إعلان Pop-under للربح (اختياري)
        if(Math.random() > 0.5) window.open("https://omg10.com/4/10241472", "_blank");
    }

    window.onload = () => {
        loadSchedule();
        startPlayer(currentStreams[0]);
        
        // إعلان عند أول ضغطة
        document.body.addEventListener('click', () => {
            if (!window.adsDone) {
                window.open("https://omg10.com/4/10241472", "_blank");
                window.adsDone = true;
            }
        }, { once: true });
    };
</script>

</body>
</html>
