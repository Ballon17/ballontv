<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mondepro | جدول المباريات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #121212; --accent: #ffcc00; --text: #fff; --dim: #a0a0a0; --live: #e50914; }
        * { margin:0; padding:0; box-sizing:border-box; outline:none !important; -webkit-tap-highlight-color: transparent; }
        body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x: hidden; }
        
        /* الهيدر */
        .top-bar { position:fixed; top:0; width:100%; height:65px; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center; z-index:1000; border-bottom:1px solid #1a1a1a; }
        .logo-text { font-weight:900; font-size:24px; color:#fff; letter-spacing: 1px; }
        .logo-text span { color:var(--accent); }

        main { padding-top: 65px; padding-bottom: 40px; }

        /* التقويم */
        .calendar-wrap { padding: 15px 10px; background: #0f0f0f; border-bottom: 1px solid #222; margin-bottom: 15px; position: sticky; top: 65px; z-index: 999; }
        .cal-days-row { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .cal-day { flex: 1; min-width: 65px; padding: 10px 5px; background: var(--surface); color: var(--dim); border-radius: 12px; border: 1px solid #222; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; gap: 4px; }
        .cal-day.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 4px 12px rgba(255,204,0,0.2); }
        .cal-day-name { font-size: 10px; font-weight: bold; }
        .cal-day-num { font-size: 18px; font-weight: 900; }

        /* الفلترة */
        .filter-row { display: flex; justify-content: center; gap: 10px; padding: 0 10px; }
        .filter-btn { flex: 1; padding: 10px; border-radius: 25px; border: 1px solid #333; background: transparent; color: var(--dim); font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }

        .section-title { font-size: 18px; font-weight: 900; margin: 15px; color:#fff; border-right: 4px solid var(--accent); padding-right: 10px; }

        /* تجميع البطولات */
        .league-group { margin: 0 15px 20px; background: rgba(255,255,255,0.02); border-radius: 15px; border: 1px solid #1a1a1a; overflow: hidden; }
        .group-header { background: #111; color: var(--accent); font-weight: 900; font-size: 13px; padding: 12px 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
        
        /* كرت المباراة */
        .m-card { background: linear-gradient(145deg, #161616, #0a0a0a); border-bottom: 1px solid #1a1a1a; padding: 20px 10px; position: relative; }
        .m-card:last-child { border-bottom: none; }
        
        .m-live-tag { position: absolute; top: 0; right: 0; font-size: 10px; font-weight: bold; padding: 4px 12px; border-bottom-left-radius: 12px; z-index: 10; color: #fff; background: #333; }
        .live-now { background: var(--live); animation: blink 1s infinite; }
        .ended { background: #444; color: #aaa; }

        .m-grid { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; text-align: center; }
        .team-box img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 8px; }
        .t-name { font-size: 12px; font-weight: 900; display: block; height: 34px; overflow: hidden; }

        .score-box { background: rgba(255,204,0,0.05); border: 1px solid rgba(255,204,0,0.1); border-radius: 10px; padding: 10px 5px; }
        .score-num { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
        .m-time { font-size: 11px; color: var(--accent); margin-top: 5px; font-weight: bold; }

        .m-footer { padding: 10px; background: rgba(0,0,0,0.2); display: flex; justify-content: center; gap: 20px; font-size: 10px; color: #666; }
        
        /* لودينج */
        .loader { text-align: center; padding: 50px; color: var(--accent); }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="logo-text">MONDE<span>PRO</span></div>
</header>

<main>
    <div class="calendar-wrap">
        <div class="cal-days-row" id="calendar-days"></div>
        <div class="filter-row">
            <button id="btn-live" class="filter-btn" onclick="setFilter('live')"><i class="fas fa-play-circle"></i> مباشر</button>
            <button id="btn-all" class="filter-btn active" onclick="setFilter('all')">كل المباريات</button>
        </div>
    </div>

    <div id="matches-content">
        <div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
    </div>
</main>

<script>
    const CONFIG = {
        API: 'https://ws.kora-api.space/api/matches/',
        PROXY: 'https://api.codetabs.com/v1/proxy?quest=',
        LOGO: 'https://cdn.kora-api.space/uploads/team/'
    };

    let currentFilter = 'all';
    let selectedDate = new Date().toISOString().split('T')[0];

    // 1. توليد التقويم تلقائياً
    function renderCalendar() {
        const container = document.getElementById('calendar-days');
        container.innerHTML = '';
        const today = new Date();
        
        for (let i = -2; i <= 2; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            const dayName = d.toLocaleDateString('ar-EG', { weekday: 'short' });
            const dayNum = d.getDate();
            
            const activeClass = dateStr === selectedDate ? 'active' : '';
            container.innerHTML += `
                <div class="cal-day ${activeClass}" onclick="changeDate('${dateStr}')">
                    <span class="cal-day-name">${dayName}</span>
                    <span class="cal-day-num">${dayNum}</span>
                </div>
            `;
        }
    }

    // 2. جلب البيانات
    async function fetchMatches() {
        const container = document.getElementById('matches-content');
        container.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

        try {
            const response = await fetch(`${CONFIG.PROXY}${encodeURIComponent(CONFIG.API + selectedDate + '/1')}`);
            const data = await response.json();
            
            if (data && data.matches) {
                renderGroups(data.matches);
            } else {
                container.innerHTML = '<div class="empty-msg">لا توجد مباريات لهذا اليوم</div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="empty-msg">فشل في جلب البيانات. تأكد من الإنترنت.</div>';
        }
    }

    // 3. تجميع المباريات حسب الدوري
    function renderGroups(matches) {
        const container = document.getElementById('matches-content');
        container.innerHTML = '';

        // تصفية حسب المباشر إذا كان الفلتر مفعل
        let filteredMatches = matches;
        if (currentFilter === 'live') {
            filteredMatches = matches.filter(m => m.status == '1');
        }

        if (filteredMatches.length === 0) {
            container.innerHTML = '<div class="empty-msg">لا توجد مباريات حالياً</div>';
            return;
        }

        // تجميع ذكي
        const groups = {};
        filteredMatches.forEach(m => {
            if (!groups[m.league]) groups[m.league] = [];
            groups[m.league].push(m);
        });

        for (const league in groups) {
            const leagueHtml = `
                <div class="league-group">
                    <div class="group-header"><i class="fas fa-trophy"></i> ${league}</div>
                    <div class="group-matches">
                        ${groups[league].map(m => createMatchCard(m)).join('')}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', leagueHtml);
        }
    }

    // 4. بناء كرت المباراة
    function createMatchCard(m) {
        let statusTag = '', statusText = 'متابعة', tagClass = '';
        
        if (m.status == '1') {
            tagClass = 'live-now';
            statusText = 'بث مباشر';
            statusTag = `<div class="m-live-tag ${tagClass}"><i class="fas fa-play-circle"></i> ${statusText}</div>`;
        } else if (m.status == '2') {
            tagClass = 'ended';
            statusText = 'انتهت';
            statusTag = `<div class="m-live-tag ${tagClass}"><i class="fas fa-check-circle"></i> ${statusText}</div>`;
        } else {
            statusTag = `<div class="m-live-tag"><i class="fas fa-clock"></i> ${statusText}</div>`;
        }

        return `
            <div class="m-card">
                ${statusTag}
                <div class="m-grid">
                    <div class="team-box">
                        <img src="${CONFIG.LOGO}${m.home_logo}" onerror="this.src='https://ui-avatars.com/api/?name=H&background=111&color=ffcc00'">
                        <span class="t-name">${m.home}</span>
                    </div>
                    <div class="score-box">
                        <div class="score-num">${m.score || '0 - 0'}</div>
                        <div class="m-time">${m.time}</div>
                    </div>
                    <div class="team-box">
                        <img src="${CONFIG.LOGO}${m.away_logo}" onerror="this.src='https://ui-avatars.com/api/?name=A&background=111&color=ffcc00'">
                        <span class="t-name">${m.away}</span>
                    </div>
                </div>
                <div class="m-footer">
                    <span><i class="fas fa-tv"></i> ${m.channel || 'غير متوفر'}</span>
                    <span><i class="fas fa-microphone"></i> ${m.commentary || 'لا يوجد'}</span>
                </div>
            </div>
        `;
    }

    // التحكم
    function changeDate(date) {
        selectedDate = date;
        renderCalendar();
        fetchMatches();
    }

    function setFilter(type) {
        currentFilter = type;
        document.getElementById('btn-all').classList.toggle('active', type === 'all');
        document.getElementById('btn-live').classList.toggle('active', type === 'live');
        fetchMatches(); // إعادة الرندر بناء على الفلتر
    }

    // التشغيل الأولي
    window.onload = () => {
        renderCalendar();
        fetchMatches();
        // تحديث تلقائي كل دقيقة
        setInterval(fetchMatches, 60000);
    };
</script>

</body>
</html>
