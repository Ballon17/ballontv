<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mondepro | Ultra Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #ffcc00;
            --text: #ffffff;
            --dim: #999;
            --live: #ff0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 20px; }

        /* الهيدر */
        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            padding: 15px; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 900; font-size: 22px; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        /* التقويم */
        .cal-container {
            padding: 15px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a;
            display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
        }
        .cal-container::-webkit-scrollbar { display: none; }
        .cal-item {
            min-width: 65px; padding: 12px 5px; background: var(--card);
            border-radius: 12px; border: 1px solid #222; text-align: center;
            cursor: pointer; transition: 0.3s;
        }
        .cal-item.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .cal-item .day-n { font-size: 10px; font-weight: bold; display: block; margin-bottom: 4px; }
        .cal-item .day-d { font-size: 20px; font-weight: 900; display: block; }

        /* الفلتر */
        .filter-tabs { display: flex; gap: 10px; padding: 15px; }
        .tab {
            flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #222;
            background: var(--card); color: var(--dim); font-weight: bold;
            cursor: pointer; text-align: center; font-size: 13px;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }

        /* البطولات */
        .league-box { margin: 0 15px 20px; border-radius: 15px; overflow: hidden; border: 1px solid #222; }
        .league-name {
            background: #1a1a1a; padding: 12px 15px; font-size: 14px;
            font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 10px;
        }
        
        /* المباريات */
        .match-card {
            background: var(--card); padding: 20px 10px; border-bottom: 1px solid #222;
            position: relative; transition: 0.2s;
        }
        .match-card:last-child { border-bottom: none; }
        .match-card:active { background: #161616; }

        .live-dot {
            position: absolute; top: 10px; right: 15px;
            background: var(--live); color: #fff; font-size: 9px;
            font-weight: bold; padding: 2px 8px; border-radius: 4px;
            animation: pulse 1s infinite;
        }

        .m-grid { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; text-align: center; }
        .team img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 8px; }
        .team .t-name { font-size: 12px; font-weight: bold; color: #eee; }

        .m-info { display: flex; flex-direction: column; align-items: center; }
        .m-score {
            font-size: 22px; font-weight: 900; color: #fff;
            background: #000; padding: 5px 15px; border-radius: 8px;
            border: 1px solid #333; min-width: 70px;
        }
        .m-status { font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: bold; }

        .m-footer {
            margin-top: 15px; padding-top: 10px; border-top: 1px dashed #222;
            display: flex; justify-content: center; gap: 20px; font-size: 11px; color: #666;
        }

        .loader { text-align: center; padding: 100px 20px; color: var(--accent); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header class="app-header">
    <div class="logo">MONDE<span>PRO</span></div>
    <div id="clock" style="font-size: 12px; font-weight: bold; color: var(--dim);">00:00:00</div>
</header>

<main id="app">
    <div class="cal-container" id="calendar"></div>
    
    <div class="filter-tabs">
        <div class="tab active" onclick="setFilter('all', this)">جميع المباريات</div>
        <div class="tab" onclick="setFilter('live', this)"><i class="fas fa-play-circle"></i> مباشر</div>
    </div>

    <div id="content">
        <div class="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>جاري مزامنة Mondepro Engine...</div>
    </div>
</main>

<script>
    // الإعدادات - إذا قمت برفع الملف على نفس الاستضافة، سيعمل تلقائياً
    const CONFIG = {
        SOURCE: window.location.origin + '/', // سيأخذ رابط موقعك تلقائياً
        FILENAME: 'index.php' // أو أي ملف يحتوي الجدول الأصلي
    };

    let currentFilter = 'all';
    let selectedDate = new Date().toISOString().split('T')[0];

    // تحديث الساعة
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-EG');
    }, 1000);

    // توليد التقويم
    function renderCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '';
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        
        for (let i = -2; i <= 3; i++) {
            let d = new Date();
            d.setDate(d.getDate() + i);
            let dStr = d.toISOString().split('T')[0];
            let active = dStr === selectedDate ? 'active' : '';
            
            cal.innerHTML += `
                <div class="cal-item ${active}" onclick="changeDate('${dStr}')">
                    <span class="day-n">${days[d.getDay()]}</span>
                    <span class="day-d">${d.getDate()}</span>
                </div>
            `;
        }
    }

    // جلب البيانات ومعالجتها
    async function syncEngine() {
        const content = document.getElementById('content');
        try {
            // ملاحظة: نستخدم fetch مباشر لأننا على نفس الدومين (يتجاوز الحماية تلقائياً)
            const response = await fetch(`${CONFIG.SOURCE}?d=${selectedDate}`);
            const html = await response.text();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const leagues = doc.querySelectorAll('.league-group');

            if (leagues.length === 0) {
                content.innerHTML = '<div class="loader" style="color:#555;">لا توجد مباريات متاحة اليوم</div>';
                return;
            }

            renderLeagues(leagues);
        } catch (error) {
            content.innerHTML = '<div class="loader" style="color:red;">فشل الاتصال بالمحرك. تأكد من رفع الملف على نفس الاستضافة.</div>';
        }
    }

    function renderLeagues(leagues) {
        const content = document.getElementById('content');
        content.innerHTML = '';

        leagues.forEach(league => {
            const leagueName = league.querySelector('.group-header').innerText.trim();
            const matches = league.querySelectorAll('.m-card');
            
            let html = `<div class="league-box"><div class="league-name"><i class="fas fa-trophy"></i> ${leagueName}</div>`;
            let hasMatches = false;

            matches.forEach(m => {
                const home = m.querySelectorAll('.t-name')[0].innerText;
                const homeImg = m.querySelectorAll('.m-logo')[0].src;
                const away = m.querySelectorAll('.t-name')[1].innerText;
                const awayImg = m.querySelectorAll('.m-logo')[1].src;
                const score = m.querySelector('.match-time-txt').innerText;
                const status = m.querySelector('.match-status-txt').innerText;
                const isLive = m.querySelector('.m-live-tag').classList.contains('live-now');

                if (currentFilter === 'live' && !isLive) return;
                hasMatches = true;

                html += `
                    <div class="match-card">
                        ${isLive ? '<div class="live-dot">LIVE</div>' : ''}
                        <div class="m-grid">
                            <div class="team">
                                <img src="${homeImg}">
                                <div class="t-name">${home}</div>
                            </div>
                            <div class="m-info">
                                <div class="m-score">${score}</div>
                                <div class="m-status">${status}</div>
                            </div>
                            <div class="team">
                                <img src="${awayImg}">
                                <div class="t-name">${away}</div>
                            </div>
                        </div>
                        <div class="m-footer">
                            <span><i class="fas fa-tv"></i> ${m.querySelector('.info-item')?.innerText || 'قناة ناقلة'}</span>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            if (hasMatches) content.innerHTML += html;
        });

        if (content.innerHTML === '') {
            content.innerHTML = '<div class="loader" style="color:#555;">لا توجد مباريات جارية حالياً</div>';
        }
    }

    // وظائف التحكم
    function changeDate(date) {
        selectedDate = date;
        renderCalendar();
        syncEngine();
    }

    function setFilter(type, el) {
        currentFilter = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        syncEngine();
    }

    // التشغيل
    window.onload = () => {
        renderCalendar();
        syncEngine();
        setInterval(syncEngine, 30000); // تحديث كل 30 ثانية
    };
</script>

</body>
</html>
