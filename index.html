<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mondepro Ultra | GitHub Edition</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --accent: #ffcc00; /* ذهبي Mondepro */
            --text: #ffffff;
            --dim: #a0a0a0;
            --live: #ff0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1a1a00, transparent 40%);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            padding: 15px 20px; border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { font-weight: 900; font-size: 24px; letter-spacing: 1px; }
        .brand span { color: var(--accent); text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }

        /* Calendar */
        .cal-wrapper {
            background: #0a0a0a; padding: 15px 10px;
            display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
        }
        .cal-wrapper::-webkit-scrollbar { display: none; }
        .date-card {
            min-width: 70px; padding: 12px 5px; background: var(--card);
            border-radius: 15px; border: 1px solid #222; text-align: center;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .date-card.active { background: var(--accent); color: #000; border-color: var(--accent); transform: scale(1.05); }
        .date-card .day-name { font-size: 10px; font-weight: bold; display: block; opacity: 0.8; }
        .date-card .day-num { font-size: 20px; font-weight: 900; display: block; }

        /* Filters */
        .filter-bar { display: flex; gap: 10px; padding: 15px; max-width: 600px; margin: 0 auto; }
        .f-btn {
            flex: 1; padding: 12px; border-radius: 30px; border: 1px solid #222;
            background: var(--card); color: var(--dim); font-weight: 900;
            cursor: pointer; transition: 0.3s; font-size: 13px; text-align: center;
        }
        .f-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* League Groups */
        .league-container { max-width: 650px; margin: 0 auto; padding: 0 15px 100px; }
        .league-group { margin-bottom: 25px; animation: fadeInUp 0.5s ease backwards; }
        .league-head {
            background: linear-gradient(90deg, #1a1a1a, transparent);
            padding: 10px 15px; border-radius: 10px; color: var(--accent);
            font-weight: 900; font-size: 14px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px; border-right: 4px solid var(--accent);
        }

        /* Match Card */
        .match-card {
            background: var(--card); border-radius: 20px; padding: 20px 15px;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.03);
            position: relative; overflow: hidden; transition: 0.3s;
        }
        .match-card:hover { border-color: var(--accent); background: #181818; }
        
        .live-badge {
            position: absolute; top: 0; left: 0; background: var(--live);
            color: #fff; font-size: 9px; font-weight: 900; padding: 4px 12px;
            border-bottom-right-radius: 15px; animation: pulse 1.5s infinite;
        }

        .m-grid { display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center; text-align: center; }
        .team img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .team .t-name { font-size: 13px; font-weight: 900; color: #fff; }

        .score-area { display: flex; flex-direction: column; align-items: center; }
        .score-box {
            font-size: 24px; font-weight: 900; color: var(--accent);
            background: #000; padding: 5px 15px; border-radius: 12px;
            border: 1px solid #333; min-width: 80px; letter-spacing: 2px;
        }
        .m-time { font-size: 11px; color: #fff; margin-top: 8px; font-weight: bold; opacity: 0.8; }

        .m-meta {
            margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: center; gap: 15px; font-size: 11px; color: #666;
        }
        .m-meta span i { color: var(--accent); margin-left: 4px; }

        /* Loader */
        .loader { text-align: center; padding: 80px 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Error Message */
        .error-msg { text-align: center; padding: 40px; color: var(--dim); }
        .error-msg i { font-size: 40px; margin-bottom: 15px; color: var(--live); }
    </style>
</head>
<body>

<header class="app-header">
    <div class="brand">MONDE<span>PRO</span></div>
    <div id="live-time" style="font-size: 12px; font-weight: 900; color: var(--accent);">00:00</div>
</header>

<main>
    <div class="cal-wrapper" id="calendar"></div>
    
    <div class="filter-bar">
        <div class="f-btn active" onclick="setFilter('all', this)">الكل</div>
        <div class="f-btn" onclick="setFilter('live', this)"><i class="fas fa-circle" style="font-size: 8px; color:red;"></i> مباشر</div>
    </div>

    <div id="content" class="league-container">
        <!-- Data will be injected here -->
    </div>
</main>

<script>
    // تكوين المحرك - يسحب من API رياضي عالمي ومجاني ومستقر جداً على GitHub
    const CONFIG = {
        API: 'https://ws.kora-api.space/api/matches/',
        LOGO: 'https://cdn.kora-api.space/uploads/team/',
        PROXY: 'https://api.codetabs.com/v1/proxy?quest='
    };

    let currentFilter = 'all';
    let selectedDate = new Date().toISOString().split('T')[0];

    // تحديث الساعة
    setInterval(() => {
        const now = new Date();
        document.getElementById('live-time').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
    }, 1000);

    // إنشاء التقويم
    function initCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = '';
        const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        
        for (let i = -2; i <= 3; i++) {
            let d = new Date();
            d.setDate(d.getDate() + i);
            let dStr = d.toISOString().split('T')[0];
            let active = dStr === selectedDate ? 'active' : '';
            
            cal.innerHTML += `
                <div class="date-card ${active}" onclick="updateDate('${dStr}')">
                    <span class="day-name">${dayNames[d.getDay()]}</span>
                    <span class="day-num">${d.getDate()}</span>
                </div>
            `;
        }
    }

    // جلب البيانات (المحرك الرئيسي)
    async function fetchMatches() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loader"><div class="spinner"></div><p>جاري مزامنة Mondepro Engine...</p></div>';

        try {
            // ملاحظة: البروكسي يساعد على تجاوز CORS على GitHub
            const response = await fetch(`${CONFIG.PROXY}${encodeURIComponent(CONFIG.API + selectedDate + '/1')}`);
            const data = await response.json();
            
            if (data && data.matches && data.matches.length > 0) {
                renderMatches(data.matches);
            } else {
                content.innerHTML = '<div class="error-msg"><i class="fas fa-calendar-times"></i><p>لا توجد مباريات متاحة لهذا اليوم</p></div>';
            }
        } catch (error) {
            content.innerHTML = '<div class="error-msg"><i class="fas fa-wifi"></i><p>خطأ في جلب البيانات. حاول تحديث الصفحة.</p></div>';
        }
    }

    // عرض البيانات
    function renderMatches(matches) {
        const content = document.getElementById('content');
        content.innerHTML = '';

        let filtered = currentFilter === 'live' ? matches.filter(m => m.status == '1') : matches;

        if (filtered.length === 0) {
            content.innerHTML = '<div class="error-msg"><i class="fas fa-play-circle" style="color:#333;"></i><p>لا توجد مباريات جارية حالياً</p></div>';
            return;
        }

        // تجميع حسب الدوري
        const leagues = {};
        filtered.forEach(m => {
            if (!leagues[m.league]) leagues[m.league] = [];
            leagues[m.league].push(m);
        });

        for (const leagueName in leagues) {
            let matchesHtml = leagues[leagueName].map(m => {
                const isLive = m.status == '1';
                return `
                    <div class="match-card">
                        ${isLive ? '<div class="live-badge">LIVE</div>' : ''}
                        <div class="m-grid">
                            <div class="team">
                                <img src="${CONFIG.LOGO}${m.home_logo}" onerror="this.src='https://ui-avatars.com/api/?name=H&background=222&color=fff'">
                                <div class="t-name">${m.home}</div>
                            </div>
                            <div class="score-area">
                                <div class="score-box">${m.score || 'vs'}</div>
                                <div class="m-time">${m.time}</div>
                            </div>
                            <div class="team">
                                <img src="${CONFIG.LOGO}${m.away_logo}" onerror="this.src='https://ui-avatars.com/api/?name=A&background=222&color=fff'">
                                <div class="t-name">${m.away}</div>
                            </div>
                        </div>
                        <div class="m-meta">
                            <span><i class="fas fa-tv"></i> ${m.channel || 'غير متوفر'}</span>
                            <span><i class="fas fa-microphone"></i> ${m.commentary || 'لا يوجد'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            content.innerHTML += `
                <div class="league-group">
                    <div class="league-head"><i class="fas fa-trophy"></i> ${leagueName}</div>
                    ${matchesHtml}
                </div>
            `;
        }
    }

    // دوال التحكم
    function updateDate(date) {
        selectedDate = date;
        initCalendar();
        fetchMatches();
    }

    function setFilter(type, el) {
        currentFilter = type;
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        fetchMatches();
    }

    // التشغيل
    window.onload = () => {
        initCalendar();
        fetchMatches();
        // تحديث البيانات كل دقيقتين
        setInterval(fetchMatches, 120000);
    };
</script>

</body>
</html>
