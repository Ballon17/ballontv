<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Mondepro Ultra | Fixed Live Edition</title> 
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style> 
        :root { --bg: #050505; --card: #121212; --accent: #ffcc00; --text: #ffffff; --dim: #a0a0a0; --live: #ff0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); background-image: radial-gradient(circle at top right, #1a1a00, transparent 40%); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        /* باقي الـ CSS كما هو */
        /* ... (لا تغيّر في CSS، احتفظ به كما هو في الكود الأصلي) ... */
        /* لسهولة القراءة، أترك CSS كما هو من الكود الأصلي */
    </style>
</head>
<body>

<header class="app-header"> 
    <div class="brand" onclick="triggerAdmin()">MONDE<span>PRO</span></div> 
    <div id="live-time" style="font-size: 12px; font-weight: 900; color: var(--accent);">00:00:00</div>
</header>

<main> 
    <div class="cal-wrapper" id="calendar"></div> 
    <div class="filter-bar"> 
        <div class="f-btn active" onclick="setFilter('all', this)">الكل</div> 
        <div class="f-btn" onclick="setFilter('live', this)"><i class="fas fa-circle" style="font-size: 8px; color:red;"></i> مباشر</div> 
    </div>
    <div id="content" class="league-container"></div>
</main>

<div class="player-overlay" id="playerOverlay">
    <div class="player-container">
        <div class="player-header">
            <div class="player-title" id="playerTitle">بث مباشر للمباراة</div>
            <button class="close-player" onclick="closePlayer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="player-wrapper">
            <iframe id="liveFrame" src="" allowfullscreen scrolling="no" allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="server-list" id="serverList"></div>
    </div>
</div>

<div class="admin-panel" id="adminPanel">
    <h3>
        <span><i class="fas fa-tools"></i> لوحة إدارة روابط البث المباشر</span>
        <span id="targetMatchId" style="font-size:12px; color:var(--accent); background:#111; padding:3px 8px; border-radius:5px;">ID: --</span>
    </h3>
    <div class="form-group">
        <label>المباراة المستهدفة</label>
        <input type="text" id="admMatchTitle" class="form-control" readonly style="opacity:0.6;">
    </div>
    <div class="form-group">
        <label>السيرفر الأول</label>
        <input type="text" id="srvUrl1" class="form-control" placeholder="رابط البث الأول هنا">
    </div>
    <div class="form-group">
        <label>السيرفر الثاني</label>
        <input type="text" id="srvUrl2" class="form-control" placeholder="رابط البث الثاني هنا">
    </div>
    <div class="form-group">
        <label>السيرفر الثالث (اختياري)</label>
        <input type="text" id="srvUrl3" class="form-control" placeholder="رابط السيرفر الثالث هنا">
    </div>
    <div class="admin-btns">
        <button class="btn-save" onclick="saveMatchLinks()">حفظ</button>
        <button class="btn-close" onclick="closeAdminPanel()">إلغاء</button>
    </div>
</div>

<!-- سكربتات -->
<script>
let currentFilter = 'all';
let selectedDate = new Date().toISOString().split('T')[0];
let isAdminMode = false;
let globalMatchesCache = [];
let customStreamsDB = JSON.parse(localStorage.getItem('mondepro_streams')) || {};

// تحديث الوقت كل ثانية
setInterval(() => {
    const now = new Date();
    document.getElementById('live-time').innerText = 
        now.getHours().toString().padStart(2, '0') + ":" + 
        now.getMinutes().toString().padStart(2, '0') + ":" + 
        now.getSeconds().toString().padStart(2, '0');
}, 1000);

// تهيئة التقويم
function initCalendar() {
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';
    const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    for (let i = -2; i <= 3; i++) {
        let d = new Date();
        d.setDate(d.getDate() + i);
        let dStr = d.toISOString().split('T')[0];
        let active = dStr === selectedDate ? 'active' : '';
        cal.innerHTML += `<div class="date-card ${active}" onclick="updateDate('${dStr}')">
            <span class="day-name">${dayNames[d.getDay()]}</span>
            <span class="day-num">${d.getDate()}</span>
        </div>`;
    }
}

// جلب المباريات
async function fetchMatches() {
    const content = document.getElementById('content');
    content.innerHTML = 'جاري سحب المباريات الحية...';

    const liveApiUrl = `https://ysscores.com/${selectedDate}/[]/[]/[]/D/180`;
    const proxyUrl = 'https://codetabs.com/?url='; // تأكد من أن هذا هو الرابط الصحيح

    try {
        const response = await fetch(`${proxyUrl}${encodeURIComponent(liveApiUrl)}`);
        const result = await response.json();
        if (result && result.data && result.data.length > 0) {
            globalMatchesCache = result.data;
            renderMatches(result.data);
        } else {
            content.innerHTML = 'لا توجد مباريات مجدولة لهذا اليوم.';
        }
    } catch(err) {
        content.innerHTML = 'خطأ في الاتصال بالشبكة الحية. يرجى إعادة تحميل الصفحة.';
        console.error(err);
    }
}

// عرض المباريات
function renderMatches(matches) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    let filtered = currentFilter === 'live' ? matches.filter(m => m.match_status === 'live' || m.match_status === '1') : matches;
    if (filtered.length === 0) {
        content.innerHTML = 'لا توجد مباريات حالياً.';
        return;
    }
    const leagues = {};
    filtered.forEach(m => {
        const leagueName = m.championship ? m.championship.title : "بطولات مختلفة";
        if (!leagues[leagueName]) leagues[leagueName] = [];
        leagues[leagueName].push(m);
    });
    for (const leagueName in leagues) {
        let matchesHtml = leagues[leagueName].map(m => {
            const isLive = m.match_status === 'live' || m.match_status === '1';
            const homeName = m.home_team ? m.home_team.title : 'غير معروف';
            const awayName = m.away_team ? m.away_team.title : 'غير معروف';
            const scoreDisplay = m.match_status === 'not_started' ? 'vs' : `${m.home_scores} - ${m.away_scores}`;
            const matchTitleStr = `${homeName} × ${awayName}`;
            const displayEditBtn = isAdminMode ? 'block' : 'none';
            return `<div class="match-card" onclick="handleMatchClick(event, '${matchTitleStr}', '${m.id}')">
                <button class="admin-edit-btn" style="display:${displayEditBtn}" onclick="openAdminPanel(event, '${matchTitleStr}', '${m.id}')"><i class="fas fa-cog"></i> إعدادات البث</button>
                ${isLive ? '<div class="live-badge">LIVE</div>' : ''}
                <div class="m-grid">
                    <div class="team">
                        <img src="${m.home_team?.logo || 'https://ui-avatars.com/api/?name=غير+معروف'}" onerror="this.src='https://ui-avatars.com/api/?name=غير+معروف'">
                        <div class="t-name">${homeName}</div>
                    </div>
                    <div class="score-area">
                        <div class="score-box">${scoreDisplay}</div>
                        <div class="m-time">${m.match_time || '--:--'}</div>
                    </div>
                    <div class="team">
                        <img src="${m.away_team?.logo || 'https://ui-avatars.com/api/?name=غير+معروف'}" onerror="this.src='https://ui-avatars.com/api/?name=غير+معروف'">
                        <div class="t-name">${awayName}</div>
                    </div>
                </div>
            </div>`;
        }).join('');
        content.innerHTML += `<div class="league-group"><div class="league-head"><i class="fas fa-trophy"></i> ${leagueName}</div>${matchesHtml}</div>`;
    }
}

// عند الضغط على مباراة
function handleMatchClick(event, title, matchId) {
    if(event.target.classList.contains('admin-edit-btn') || event.target.parentElement.classList.contains('admin-edit-btn')) return;
    openPlayer(title, matchId);
}

// فتح المشغل
function openPlayer(title, matchId) {
    document.getElementById('playerTitle').innerText = title;
    const serverList = document.getElementById('serverList');
    serverList.innerHTML = '';
    const savedLinks = customStreamsDB[matchId] || [];
    if (savedLinks.length === 0 || savedLinks.every(url => url === "")) {
        serverList.innerHTML = 'لم يتم إضافة روابط بث لهذه المباراة بعد.';
        document.getElementById('liveFrame').src = '';
    } else {
        let firstActiveSet = false;
        savedLinks.forEach((url, index) => {
            if(url && url.trim() !== "") {
                const btn = document.createElement('button');
                btn.className = 'server-btn' + (!firstActiveSet ? ' active' : '');
                btn.innerText = `سيرفر ${index + 1}`;
                btn.onclick = () => {
                    document.getElementById('liveFrame').src = url;
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                serverList.appendChild(btn);
                if(!firstActiveSet) {
                    document.getElementById('liveFrame').src = url;
                    firstActiveSet = true;
                }
            }
        });
    }
    document.getElementById('playerOverlay').style.display = 'flex';
}

// إغلاق المشغل
function closePlayer() {
    document.getElementById('playerOverlay').style.display = 'none';
    document.getElementById('liveFrame').src = '';
}

// تفعيل وضع المشرف
function triggerAdmin() {
    const password = prompt("أدخل كلمة مرور الإدارة لفتح لوحة التحكم:");
    if (password === "1234") {
        isAdminMode = !isAdminMode;
        alert(isAdminMode ? "تم تفعيل لوحة التحكم!" : "تم إغلاق لوحة التحكم.");
        renderMatches(globalMatchesCache);
    } else if (password !== null) {
        alert("كلمة المرور غير صحيحة!");
    }
}

// فتح لوحة الإدارة
function openAdminPanel(event, title, matchId) {
    event.stopPropagation();
    document.getElementById('targetMatchId').innerText = `ID: ${matchId}`;
    document.getElementById('admMatchTitle').value = title;
    const existing = customStreamsDB[matchId] || ["", "", ""];
    document.getElementById('srvUrl1').value = existing[0] || "";
    document.getElementById('srvUrl2').value = existing[1] || "";
    document.getElementById('srvUrl3').value = existing[2] || "";
    document.getElementById('adminPanel').style.display = 'block';
}

// إغلاق لوحة الإدارة
function closeAdminPanel() {
    document.getElementById('adminPanel').style.display = 'none';
}

// حفظ روابط البث
function saveMatchLinks() {
    const matchId = document.getElementById('targetMatchId').innerText.replace('ID: ', '');
    const url1 = document.getElementById('srvUrl1').value.trim();
    const url2 = document.getElementById('srvUrl2').value.trim();
    const url3 = document.getElementById('srvUrl3').value.trim();
    customStreamsDB[matchId] = [url1, url2, url3];
    localStorage.setItem('mondepro_streams', JSON.stringify(customStreamsDB));
    alert("تم حفظ روابط البث بنجاح!");
    closeAdminPanel();
    renderMatches(globalMatchesCache);
}

// تحديث التاريخ
function updateDate(date) {
    selectedDate = date;
    initCalendar();
    fetchMatches();
}

// تغيير الفلتر
function setFilter(type, el) {
    currentFilter = type;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    fetchMatches();
}

// تهيئة الصفحة عند التحميل
document.addEventListener("DOMContentLoaded", () => {
    initCalendar();
    fetchMatches();
    setInterval(fetchMatches, 60000);
});
</script>
</body>
</html>
